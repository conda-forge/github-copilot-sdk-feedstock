schema_version: 1

context:
  name: github-copilot-sdk
  version: "1.0.16"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/py3/${{ name[0] }}/${{ name }}/github_copilot_sdk-${{ version }}-py3-none-any.whl
  sha256: fcbc9e2673d5cf3da40c4095fd841d39f04ff2c9b09dfc970b3fb5f962f47a0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install github*whl -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=45
    - wheel
    - setuptools-scm >=6.2
    - pip
  run:
    - python >=${{ python_min }}
    - httpx
    - python-dateutil >=2.9.0.post0
    - pydantic >=2.0
    - typing_extensions >=4.0.0

tests:
  - python:
      imports:
        - copilot
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python SDK for GitHub Copilot CLI
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/github/copilot-sdk

extra:
  recipe-maintainers:
    - akrherz
